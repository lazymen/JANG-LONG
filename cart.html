<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CART | JANG LONG</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="cart-page">

    <div class="container">

        <header>

            <h1 class="logo">
                <a href="index.html">JANG LONG</a>
            </h1>

            <p class="tagline">
                Living Killed The Dream
            </p>

        </header>


        <div class="utility-nav">

            <a href="cart.html" class="cart-entry">
                CART (<span id="cart-count">0</span>)
            </a>

            <button type="button" class="search-entry" id="search-entry">
                SEARCH
            </button>

        </div>


        <div class="search-panel" id="search-panel">

            <form id="site-search-form" class="search-form">

                <input type="search" id="site-search-input" autocomplete="off">

                <button type="submit">
                    GO
                </button>

            </form>

        </div>


        <nav class="mobile-nav">

            <button class="mobile-menu-btn" id="mobile-menu-btn">
                MENU
            </button>

            <div class="mobile-menu-list" id="mobile-menu-list">

                <a href="index.html">HOME</a>
                <a href="shop.html">SHOP</a>

                <a href="https://blog.naver.com/lazy-vintage-luv" target="_blank" rel="noopener">
                    BLOG
                </a>

                <a href="about.html">
                    ABOUT
                </a>

            </div>

        </nav>


        <nav class="sidebar">

            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>

            <a href="https://blog.naver.com/lazy-vintage-luv" target="_blank" rel="noopener">
                BLOG
            </a>

            <a href="about.html">ABOUT</a>

        </nav>


        <main class="cart-main">

            <h2 class="cart-title">
                CART
            </h2>


            <div id="cart-list" class="cart-list"></div>


            <p id="cart-empty" class="cart-empty">
                YOUR CART IS EMPTY.
            </p>


            <div id="cart-summary" class="cart-summary">

                <div class="cart-total">

                    <span>
                        TOTAL
                    </span>

                    <span id="cart-total">
                        ₩ 0
                    </span>

                </div>


                <button type="button" class="checkout-button" id="checkout-button" disabled>
                    CHECKOUT
                </button>

            </div>

        </main>

    </div>


    <script src="js/product-status.js"></script>
    <script src="js/products-data.js"></script>

    <script src="js/cart-store.js"></script>
    <script src="js/cart-ui.js"></script>
    <script src="js/cart-page.js"></script>

    <script src="js/mobile-menu.js"></script>
    <script src="js/search-toggle.js"></script>

</body>

</html>
