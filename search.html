<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SEARCH | JANG LONG</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="search-page">

    <div class="container">

        <header>

            <h1 class="logo">
                <a href="index.html">JANG LONG</a>
            </h1>

            <p class="tagline">
                Living Killed The Dream
            </p>

        </header>


        <!-- 전역 SEARCH -->

        <div class="utility-nav">

            <a href="cart.html" class="cart-entry">
                CART (<span id="cart-count">0</span>)
            </a>

            <a href="order.html" class="order-entry">ORDER</a>

            <button type="button" class="search-entry" id="search-entry">
                SEARCH
            </button>

        </div>


        <div class="search-panel" id="search-panel">

            <form id="site-search-form" class="search-form">

                <input type="search" id="site-search-input" autocomplete="off">

                <button type="submit">GO</button>

            </form>

        </div>


        <!-- 모바일 메뉴 -->

        <div class="mobile-shop-header">

            <nav class="mobile-nav">

                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    MENU
                </button>

                <div class="mobile-menu-list" id="mobile-menu-list">

                    <a href="index.html">HOME</a>
                    <a href="shop.html">SHOP</a>

                    <a href="https://blog.naver.com/lazy-vintage-luv" target="_blank" rel="noopener">
                        BLOG
                    </a>

                    <a href="about.html">ABOUT</a>
<a href="guide.html">GUIDE</a>

                </div>

            </nav>

        </div>

        <nav class="sidebar">
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="https://blog.naver.com/lazy-vintage-luv" target="_blank">BLOG</a>
            <a href="about.html">ABOUT</a>
<a href="guide.html">GUIDE</a>
        </nav>

        <main class="search-page-main">

            <a href="javascript:history.back()" class="back-button">
                ← BACK
            </a>


            <div id="search-query" class="search-query"></div>


            <div class="section-title">
                AVAILABLE
            </div>

            <section id="available-grid" class="product-grid">
            </section>


            <div class="section-title archive">
                GONE.
            </div>

            <section id="gone-grid" class="product-grid">
            </section>


            <p id="search-empty" class="search-empty">
                NO PRODUCT FOUND.
            </p>

        </main>

    </div>


    <script src="js/product-status.js"></script>
    <script src="js/product-card.js"></script>
    <script src="js/products-data.js"></script>

    <script src="js/cart-store.js"></script>
    <script src="js/cart-ui.js"></script>

    <script src="js/search.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script src="js/search-toggle.js"></script>

</html>
