<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANG LONG</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="product-page">

    <nav class="mobile-nav">

        <button class="mobile-menu-btn" id="mobile-menu-btn">
            MENU
        </button>

        <div class="mobile-menu-list" id="mobile-menu-list">

            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="https://blog.naver.com/lazy-vintage-luv" target="_blank" rel="noopener">BLOG</a>
            <a href="about.html">ABOUT</a>

        </div>

    </nav>

    <header>

        <h1 class="logo">
            <a href="index.html">JANG LONG</a>
        </h1>

        <p class="tagline">
            Living Killed The Dream
        </p>

    </header>

    <div class="utility-nav">

        <a href="cart.html" class="cart-entry">
            CART (<span id="cart-count">0</span>)
        </a>

        <a href="order.html" class="order-entry">ORDER</a>

        <button type="button" class="search-entry" id="search-entry">
            SEARCH
        </button>

    </div>

    <div class="search-panel" id="search-panel">

        <form id="site-search-form" class="search-form">

            <input type="search" id="site-search-input" autocomplete="off">

            <button type="submit">GO</button>

        </form>

    </div>

    <main class="product-detail">

        <a href="shop.html" class="back-button">
            ← BACK
        </a>

        <section class="product-hero">

            <div class="product-image">

                <img id="main-image" src="">

            </div>

            <div class="product-info">

                <div class="product-title-row">
                    <h1 id="product-name"></h1>
                    <p id="product-price"></p>
                </div>

                <p id="product-country"></p>

                <p id="product-size"></p>



                <div id="measurement-list" class="measurement-list"></div>

                <hr>

                <p id="product-description" class="description"></p>

                <div id="product-notes" class="product-notes"></div>

                <button type="button" class="add-to-cart" id="add-to-cart">
                    ADD TO CART
                </button>

            </div>

        </section>

        <section id="detail-gallery" class="detail-gallery">

        </section>

    </main>

    <script src="js/product-status.js"></script>
    <script src="js/products-data.js"></script>

    <script src="js/cart-store.js"></script>
    <script src="js/cart-ui.js"></script>

    <script src="js/product.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script src="js/search-toggle.js"></script>

</body>

</html>
